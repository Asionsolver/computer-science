<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img"><title>2  FROM LETTER SHAPES TO DOT PATTERNS</title><rect width="1000" height="650" fill="#ffffff"/><text x="30" y="42" font-family="DejaVu Sans,sans-serif" font-size="27" fill="#0f172a">2  FROM LETTER SHAPES TO DOT PATTERNS</text><rect x="35" y="85" width="930" height="145" rx="12" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/><text x="60" y="123" font-family="DejaVu Sans,sans-serif" font-size="25" fill="#2563eb">1  Valentin Haüy: raised letters</text><text x="60" y="165" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#0f172a">Keep the shape of a printed letter.</text><text x="60" y="201" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#64748b">Reading these shapes by touch was difficult.</text><path d="M500 237 L500 266" fill="none" stroke="#9333ea" stroke-width="3"/><path d="M500 266 L494.7263190753538 256.3465918192059" fill="none" stroke="#9333ea" stroke-width="3"/><path d="M500 266 L505.2736809246462 256.3465918192059" fill="none" stroke="#9333ea" stroke-width="3"/><rect x="35" y="275" width="930" height="145" rx="12" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/><text x="60" y="313" font-family="DejaVu Sans,sans-serif" font-size="25" fill="#2563eb">2  Charles Barbier: night writing</text><text x="60" y="355" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#0f172a">Raised patterns represent sounds.</text><text x="60" y="391" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#64748b">Useful idea, but complex for longer text.</text><path d="M500 427 L500 456" fill="none" stroke="#9333ea" stroke-width="3"/><path d="M500 456 L494.7263190753538 446.3465918192059" fill="none" stroke="#9333ea" stroke-width="3"/><path d="M500 456 L505.2736809246462 446.3465918192059" fill="none" stroke="#9333ea" stroke-width="3"/><rect x="35" y="465" width="930" height="145" rx="12" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/><text x="60" y="503" font-family="DejaVu Sans,sans-serif" font-size="25" fill="#2563eb">3  Louis Braille: six-dot cell</text><text x="60" y="545" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#0f172a">Small dot patterns represent a code.</text><text x="60" y="581" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#64748b">Each of six positions is either raised or flat.</text></svg>