<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" role="img"><title>1  BRAILLE CELL | 2 columns × 3 rows</title><rect width="1000" height="590" fill="#ffffff"/><text x="30" y="42" font-family="DejaVu Sans,sans-serif" font-size="27" fill="#0f172a">1  BRAILLE CELL | 2 columns × 3 rows</text><rect x="30" y="80" width="440" height="380" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="55" y="120" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#0f172a">POSITION NUMBERS</text><circle cx="170" cy="190" r="28" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="164" y="196" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#64748b">1</text><circle cx="170" cy="275" r="28" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="164" y="281" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#64748b">2</text><circle cx="170" cy="360" r="28" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="164" y="366" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#64748b">3</text><circle cx="255" cy="190" r="28" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="249" y="196" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#64748b">4</text><circle cx="255" cy="275" r="28" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="249" y="281" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#64748b">5</text><circle cx="255" cy="360" r="28" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="249" y="366" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#64748b">6</text><text x="85" y="420" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#0f172a">Read positions down the left, then right.</text><rect x="520" y="80" width="450" height="380" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="545" y="120" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#0f172a">EXAMPLE: dots 1, 3, 5 raised</text><circle cx="650" cy="190" r="28" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><text x="644" y="196" font-family="DejaVu Sans,sans-serif" font-size="16" fill="white">1</text><circle cx="650" cy="275" r="28" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="644" y="281" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#64748b">2</text><circle cx="650" cy="360" r="28" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><text x="644" y="366" font-family="DejaVu Sans,sans-serif" font-size="16" fill="white">3</text><circle cx="735" cy="190" r="28" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="729" y="196" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#64748b">4</text><circle cx="735" cy="275" r="28" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><text x="729" y="281" font-family="DejaVu Sans,sans-serif" font-size="16" fill="white">5</text><circle cx="735" cy="360" r="28" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="729" y="366" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#64748b">6</text><text x="555" y="420" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#0f172a">Filled = raised (1); hollow = flat (0).</text><text x="30" y="503" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#0f172a">Bit order:</text><text x="30" y="582" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#64748b">Dot numbers name positions, not the reading order of letters or a numeric value.</text><text x="210" y="503" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#0f172a">dot 1</text><text x="228" y="544" font-family="DejaVu Sans,sans-serif" font-size="25" fill="#2563eb">1</text><text x="325" y="503" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#0f172a">dot 2</text><text x="343" y="544" font-family="DejaVu Sans,sans-serif" font-size="25" fill="#2563eb">0</text><text x="440" y="503" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#0f172a">dot 3</text><text x="458" y="544" font-family="DejaVu Sans,sans-serif" font-size="25" fill="#2563eb">1</text><text x="555" y="503" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#0f172a">dot 4</text><text x="573" y="544" font-family="DejaVu Sans,sans-serif" font-size="25" fill="#2563eb">0</text><text x="670" y="503" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#0f172a">dot 5</text><text x="688" y="544" font-family="DejaVu Sans,sans-serif" font-size="25" fill="#2563eb">1</text><text x="785" y="503" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#0f172a">dot 6</text><text x="803" y="544" font-family="DejaVu Sans,sans-serif" font-size="25" fill="#2563eb">0</text></svg>