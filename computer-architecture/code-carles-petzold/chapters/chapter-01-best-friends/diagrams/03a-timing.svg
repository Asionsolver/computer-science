<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="655" viewBox="0 0 1000 655" role="img"><title>3A  MORSE TIMING | one dot defines the time unit</title><rect width="1000" height="655" fill="#ffffff"/><text x="30" y="42" font-family="DejaVu Sans,sans-serif" font-size="27" fill="#0f172a">3A  MORSE TIMING | one dot defines the time unit</text><text x="35" y="141" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#0f172a">Dot</text><rect x="320" y="115" width="68" height="42" rx="12" fill="#fef08a" stroke="#c26909" stroke-width="2"/><text x="810" y="143" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#0f172a">1 unit</text><text x="35" y="231" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#0f172a">Dash</text><rect x="320" y="205" width="68" height="42" rx="12" fill="#fef08a" stroke="#c26909" stroke-width="2"/><rect x="395" y="205" width="68" height="42" rx="12" fill="#fef08a" stroke="#c26909" stroke-width="2"/><rect x="470" y="205" width="68" height="42" rx="12" fill="#fef08a" stroke="#c26909" stroke-width="2"/><text x="810" y="233" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#0f172a">3 units</text><text x="35" y="321" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#0f172a">Within a letter</text><rect x="320" y="295" width="68" height="42" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="810" y="323" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#0f172a">1 unit</text><text x="35" y="411" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#0f172a">Between letters</text><rect x="320" y="385" width="68" height="42" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><rect x="395" y="385" width="68" height="42" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><rect x="470" y="385" width="68" height="42" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="810" y="413" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#0f172a">3 units</text><text x="35" y="501" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#0f172a">Between words*</text><rect x="320" y="475" width="68" height="42" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><rect x="395" y="475" width="68" height="42" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><rect x="470" y="475" width="68" height="42" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><rect x="545" y="475" width="68" height="42" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><rect x="620" y="475" width="68" height="42" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><rect x="695" y="475" width="68" height="42" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="810" y="503" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#0f172a">6 units</text><text x="320" y="85" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#2563eb">Each box = 1 unit of time</text><text x="35" y="590" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#0f172a">Yellow = light ON. Gray = light OFF. Both dot and dash are ON.</text><text x="35" y="631" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#64748b">* Six units follows this PDF’s Chapter 1 example, not a universal timing rule.</text></svg>