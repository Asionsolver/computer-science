<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img"><title>2  THREE IDEAS | improve the way you encode letters</title><rect width="1000" height="640" fill="#ffffff"/><text x="30" y="42" font-family="DejaVu Sans,sans-serif" font-size="27" fill="#0f172a">2  THREE IDEAS | improve the way you encode letters</text><rect x="30" y="90" width="940" height="145" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="50" y="126" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#2563eb">1  DRAW LETTERS IN THE AIR</text><text x="50" y="168" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#0f172a">Move the flashlight to sketch a letter.</text><text x="50" y="205" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#64748b">Hard for the friend to reconstruct the strokes.</text><path d="M500 240 L500 265" fill="none" stroke="#9333ea" stroke-width="3"/><path d="M500 265 L494.7263190753538 255.3465918192059" fill="none" stroke="#9333ea" stroke-width="3"/><path d="M500 265 L505.2736809246462 255.3465918192059" fill="none" stroke="#9333ea" stroke-width="3"/><rect x="30" y="270" width="940" height="145" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="50" y="306" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#2563eb">2  COUNT BLINKS: A=1, B=2, …, Z=26</text><text x="50" y="348" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#0f172a">Use blink count to identify each letter.</text><text x="50" y="385" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#64748b">Works in principle, but many flashes are needed.</text><path d="M500 420 L500 445" fill="none" stroke="#9333ea" stroke-width="3"/><path d="M500 445 L494.7263190753538 435.3465918192059" fill="none" stroke="#9333ea" stroke-width="3"/><path d="M500 445 L505.2736809246462 435.3465918192059" fill="none" stroke="#9333ea" stroke-width="3"/><rect x="30" y="450" width="940" height="145" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="50" y="486" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#2563eb">3  MORSE: SHORT AND LONG FLASHES</text><text x="50" y="528" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#0f172a">Use dot/dash patterns agreed by both friends.</text><text x="50" y="565" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#64748b">Common letters can have short codes; pauses separate them.</text></svg>