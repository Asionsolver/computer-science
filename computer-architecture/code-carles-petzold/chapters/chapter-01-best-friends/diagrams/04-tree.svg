ly="DejaVu Sans,sans-serif" font-size="22" fill="#0f172a">Dot (.) = blue / left. Dash (-) = orange / right.</text><text x="30" y="548" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#2563eb">Example: dot → dash → dot gives START → E → A → R.</text><text x="30" y="590" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#64748b">Wait for the letter boundary, then restart. More levels appear in Chapter 2.</text></svg>