<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" role="img"><title>1  TWO FRIENDS | a message crosses the street</title><rect width="1000" height="590" fill="#ffffff"/><text x="30" y="42" font-family="DejaVu Sans,sans-serif" font-size="27" fill="#0f172a">1  TWO FRIENDS | a message crosses the street</text><rect x="30" y="100" width="310" height="340" rx="12" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/><text x="50" y="140" font-family="DejaVu Sans,sans-serif" font-size="25" fill="#2563eb">YOUR ROOM</text><rect x="50" y="170" width="270" height="130" rx="12" fill="#eff6ff" stroke="#64748b" stroke-width="2"/><path d="M185 170 L185 300" fill="none" stroke="#64748b" stroke-width="3"/><path d="M50 235 L320 235" fill="none" stroke="#64748b" stroke-width="3"/><rect x="660" y="100" width="310" height="340" rx="12" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/><text x="680" y="140" font-family="DejaVu Sans,sans-serif" font-size="25" fill="#2563eb">FRIEND’S ROOM</text><rect x="680" y="170" width="270" height="130" rx="12" fill="#eff6ff" stroke="#64748b" stroke-width="2"/><path d="M815 170 L815 300" fill="none" stroke="#64748b" stroke-width="3"/><path d="M680 235 L950 235" fill="none" stroke="#64748b" stroke-width="3"/><rect x="85" y="230" width="95" height="35" rx="12" fill="#334155" stroke="#64748b" stroke-width="2"/><path d="M180 230 L210 215 L210 280 L180 265 Z" fill="#475569"/><path d="M210 215 L815 180 L815 290 L210 280 Z" fill="#fef08a" opacity="0.65"/><path d="M350 245 L640 245" fill="none" stroke="#c26909" stroke-width="3"/><path d="M640 245 L630.3465918192059 250.27368092464624" fill="none" stroke="#c26909" stroke-width="3"/><path d="M640 245 L630.3465918192059 239.72631907535376" fill="none" stroke="#c26909" stroke-width="3"/><text x="85" y="347" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#0f172a">1. Choose a message</text><text x="85" y="385" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#0f172a">2. Blink its code</text><text x="690" y="347" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#0f172a">3. Watch the flashes</text><text x="690" y="385" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#0f172a">4. Decode the message</text><text x="405" y="335" font-family="DejaVu Sans,sans-serif" font-size="25" fill="#64748b">STREET</text><text x="362" y="380" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#64748b">No connecting wire</text><text x="35" y="490" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#0f172a">Light carries a timed pattern; the receiver must know what that pattern means.</text><text x="35" y="540" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#0f172a">The windows need a clear line of sight for this flashlight example.</text></svg>