<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" role="img"><title>6  MESSAGE → SIGNAL → MESSAGE</title><rect width="1000" height="590" fill="#ffffff"/><text x="30" y="42" font-family="DejaVu Sans,sans-serif" font-size="27" fill="#0f172a">6  MESSAGE → SIGNAL → MESSAGE</text><rect x="30" y="160" width="165" height="150" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="42" y="198" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#2563eb">MESSAGE</text><text x="42" y="259" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#0f172a">Choose “A”</text><path d="M199 234 L220 234" fill="none" stroke="#c26909" stroke-width="3"/><path d="M220 234 L210.3465918192059 239.27368092464624" fill="none" stroke="#c26909" stroke-width="3"/><path d="M220 234 L210.3465918192059 228.72631907535376" fill="none" stroke="#c26909" stroke-width="3"/><rect x="225" y="160" width="165" height="150" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="237" y="198" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#2563eb">ENCODE</text><text x="237" y="259" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#0f172a">A becomes .-</text><path d="M394 234 L415 234" fill="none" stroke="#c26909" stroke-width="3"/><path d="M415 234 L405.3465918192059 239.27368092464624" fill="none" stroke="#c26909" stroke-width="3"/><path d="M415 234 L405.3465918192059 228.72631907535376" fill="none" stroke="#c26909" stroke-width="3"/><rect x="420" y="160" width="165" height="150" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="432" y="198" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#2563eb">SEND</text><text x="432" y="259" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#0f172a">Short / long light</text><path d="M589 234 L610 234" fill="none" stroke="#c26909" stroke-width="3"/><path d="M610 234 L600.3465918192059 239.27368092464624" fill="none" stroke="#c26909" stroke-width="3"/><path d="M610 234 L600.3465918192059 228.72631907535376" fill="none" stroke="#c26909" stroke-width="3"/><rect x="615" y="160" width="165" height="150" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="627" y="198" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#2563eb">OBSERVE</text><text x="627" y="259" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#0f172a">Eyes see timing</text><path d="M784 234 L805 234" fill="none" stroke="#c26909" stroke-width="3"/><path d="M805 234 L795.3465918192059 239.27368092464624" fill="none" stroke="#c26909" stroke-width="3"/><path d="M805 234 L795.3465918192059 228.72631907535376" fill="none" stroke="#c26909" stroke-width="3"/><rect x="810" y="160" width="165" height="150" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="822" y="198" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#2563eb">DECODE</text><text x="822" y="259" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#0f172a">.- means A</text><rect x="180" y="390" width="640" height="90" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/><text x="205" y="428" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15803d">Shared rule: both friends know the same Morse code.</text><text x="205" y="461" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#0f172a">The light carries the pattern, not a written letter A.</text><text x="35" y="548" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#0f172a">Clear flashes + clear gaps + a shared code allow the receiver to recover the message.</text></svg>