<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img"><title>5  HOW ARE YOU? | compare blink counts carefully</title><rect width="1000" height="660" fill="#ffffff"/><text x="30" y="42" font-family="DejaVu Sans,sans-serif" font-size="27" fill="#0f172a">5  HOW ARE YOU? | compare blink counts carefully</text><rect x="30" y="90" width="450" height="460" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="50" y="130" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#2563eb">COUNTING: A=1 … Z=26</text><rect x="520" y="90" width="450" height="460" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="540" y="130" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#2563eb">MORSE: DOT / DASH</text><text x="50" y="195" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#0f172a">HOW: 8 + 15 + 23 = 46</text><text x="50" y="260" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#0f172a">ARE: 1 + 18 + 5 = 24</text><text x="50" y="325" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#0f172a">YOU: 25 + 15 + 21 = 61</text><text x="50" y="400" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#0f172a">Letters only: 131 blinks</text><text x="50" y="475" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#0f172a">? has not been assigned a code</text><text x="540" y="195" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#0f172a">HOW: 4 + 3 + 3 = 10</text><text x="540" y="260" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#0f172a">ARE: 2 + 3 + 1 = 6</text><text x="540" y="325" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#0f172a">YOU: 4 + 3 + 3 = 10</text><text x="540" y="390" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#0f172a">?: ..--.. = 6</text><text x="540" y="475" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#0f172a">26 + 6 = 32 light pulses</text><text x="35" y="600" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#0f172a">Counts are ON pulses, not elapsed time. A dash lasts longer than a dot.</text><text x="35" y="640" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#64748b">The Morse total includes “?”; the simple counting total covers only the letters.</text></svg>