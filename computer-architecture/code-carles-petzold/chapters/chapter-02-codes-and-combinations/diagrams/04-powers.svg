<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="715" viewBox="0 0 1000 715" role="img"><title>4  POWERS OF TWO | same-scale bars</title><rect width="1000" height="715" fill="#ffffff"/><text x="30" y="42" font-family="DejaVu Sans,sans-serif" font-size="27" fill="#0f172a">4  POWERS OF TWO | same-scale bars</text><text x="35" y="120" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#0f172a">n = 1</text><rect x="180" y="98" width="1.2" height="25" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="196.2" y="118" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#2563eb">2</text><text x="35" y="168" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#0f172a">n = 2</text><rect x="180" y="146" width="2.4" height="25" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="197.4" y="166" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#2563eb">4</text><text x="35" y="216" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#0f172a">n = 3</text><rect x="180" y="194" width="4.8" height="25" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="199.8" y="214" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#2563eb">8</text><text x="35" y="264" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#0f172a">n = 4</text><rect x="180" y="242" width="9.6" height="25" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="204.6" y="262" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#2563eb">16</text><text x="35" y="312" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#0f172a">n = 5</text><rect x="180" y="290" width="19.2" height="25" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="214.2" y="310" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#2563eb">32</text><text x="35" y="360" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#0f172a">n = 6</text><rect x="180" y="338" width="38.4" height="25" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="233.4" y="358" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#2563eb">64</text><text x="35" y="408" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#0f172a">n = 7</text><rect x="180" y="386" width="76.8" height="25" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="271.8" y="406" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#2563eb">128</text><text x="35" y="456" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#0f172a">n = 8</text><rect x="180" y="434" width="153.6" height="25" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="348.6" y="454" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#2563eb">256</text><text x="35" y="504" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#0f172a">n = 9</text><rect x="180" y="482" width="307.2" height="25" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="502.2" y="502" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#2563eb">512</text><text x="35" y="552" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#0f172a">n = 10</text><rect x="180" y="530" width="614.4" height="25" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="809.4" y="550" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#2563eb">1024</text><text x="35" y="630" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#0f172a">Exactly n dot/dash choices → 2ⁿ patterns.</text><text x="35" y="674" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#0f172a">Counts double every step, even when the first bars look very short.</text><text x="35" y="706" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#64748b">For n = 1…10: 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024.</text></svg>