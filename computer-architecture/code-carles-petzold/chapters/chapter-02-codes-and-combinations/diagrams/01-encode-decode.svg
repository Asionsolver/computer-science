<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510" viewBox="0 0 1000 510" role="img"><title>1  ENCODE vs DECODE | start from different information</title><rect width="1000" height="510" fill="#ffffff"/><text x="30" y="42" font-family="DejaVu Sans,sans-serif" font-size="27" fill="#0f172a">1  ENCODE vs DECODE | start from different information</text><rect x="30" y="90" width="940" height="170" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="55" y="127" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#0f172a">SENDER: you already know the letter</text><text x="100" y="192" font-family="DejaVu Sans Mono,monospace" font-size="38" fill="#2563eb">Y</text><path d="M300 178 L650 178" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M650 178 L640.3465918192059 183.27368092464624" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M650 178 L640.3465918192059 172.72631907535376" fill="none" stroke="#2563eb" stroke-width="3"/><text x="730" y="192" font-family="DejaVu Sans Mono,monospace" font-size="38" fill="#2563eb">-.--</text><text x="300" y="235" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#0f172a">Look up Y in an alphabetical table.</text><rect x="30" y="290" width="940" height="170" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="55" y="327" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#0f172a">RECEIVER: you only know the signal</text><text x="100" y="392" font-family="DejaVu Sans Mono,monospace" font-size="38" fill="#2563eb">-.--</text><path d="M300 378 L650 378" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M650 378 L640.3465918192059 383.2736809246462" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M650 378 L640.3465918192059 372.7263190753538" fill="none" stroke="#2563eb" stroke-width="3"/><text x="730" y="392" font-family="DejaVu Sans Mono,monospace" font-size="38" fill="#2563eb">Y</text><text x="300" y="435" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#0f172a">Follow each dot / dash in a decision tree.</text><text x="30" y="499" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#0f172a">The message is the same; the useful lookup direction is different.</text></svg>