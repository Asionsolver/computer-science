" y="489" font-family="DejaVu Sans Mono,monospace" font-size="20" fill="#2563eb">--.-</text><text x="807" y="489" font-family="DejaVu Sans Mono,monospace" font-size="20" fill="#2563eb">---.</text><text x="889" y="489" font-family="DejaVu Sans Mono,monospace" font-size="20" fill="#2563eb">----</text><rect x="30" y="555" width="940" height="75" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/><text x="55" y="587" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#15803d">Exactly 4 signals: 16 patterns.</text><text x="55" y="618" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#15803d">Lengths 1–4 together: 2 + 4 + 8 + 16 = 30 patterns.</text></svg>