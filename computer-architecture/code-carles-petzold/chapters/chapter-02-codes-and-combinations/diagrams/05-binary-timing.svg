<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="735" viewBox="0 0 1000 735" role="img"><title>5  TWO CHOICES DOES NOT MEAN THE SAME PHYSICAL SIGNAL</title><rect width="1000" height="735" fill="#ffffff"/><text x="30" y="42" font-family="DejaVu Sans,sans-serif" font-size="27" fill="#0f172a">5  TWO CHOICES DOES NOT MEAN THE SAME PHYSICAL SIGNAL</text><rect x="30" y="85" width="300" height="200" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="50" y="125" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#2563eb">COIN</text><text x="50" y="181" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#0f172a">Head</text><text x="50" y="234" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#0f172a">Tail</text><rect x="355" y="85" width="300" height="200" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="375" y="125" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#2563eb">LIGHT STATE</text><text x="375" y="181" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#0f172a">ON</text><text x="375" y="234" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#0f172a">OFF</text><rect x="680" y="85" width="300" height="200" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="700" y="125" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#2563eb">MORSE ELEMENT</text><text x="700" y="181" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#0f172a">Dot: short ON</text><text x="700" y="234" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#0f172a">Dash: long ON</text><text x="35" y="330" font-family="DejaVu Sans,sans-serif" font-size="26" fill="#2563eb">Example: A = dot then dash (.-)</text><text x="55" y="407" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#0f172a">ON</text><text x="55" y="477" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#0f172a">OFF</text><path d="M135 470 L160 470" fill="none" stroke="#2563eb" stroke-width="4"/><path d="M160 470 L160 400" fill="none" stroke="#2563eb" stroke-width="4"/><path d="M160 400 L250 400" fill="none" stroke="#2563eb" stroke-width="4"/><path d="M250 400 L250 470" fill="none" stroke="#2563eb" stroke-width="4"/><path d="M250 470 L340 470" fill="none" stroke="#2563eb" stroke-width="4"/><path d="M340 470 L340 400" fill="none" stroke="#2563eb" stroke-width="4"/><path d="M340 400 L610 400" fill="none" stroke="#2563eb" stroke-width="4"/><path d="M610 400 L610 470" fill="none" stroke="#2563eb" stroke-width="4"/><path d="M610 470 L880 470" fill="none" stroke="#2563eb" stroke-width="4"/><text x="168" y="515" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#0f172a">dot</text><text x="168" y="550" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#64748b">1 unit</text><text x="258" y="515" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#0f172a">gap</text><text x="258" y="550" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#64748b">1 unit</text><text x="348" y="515" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#0f172a">dash</text><text x="348" y="550" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#64748b">3 units</text><text x="618" y="515" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#0f172a">letter gap</text><text x="618" y="550" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#64748b">3 units</text><text x="35" y="610" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#2563eb">Both dot and dash are LIGHT ON; their durations differ.</text><text x="35" y="658" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#c26909">OFF intervals separate elements and letters. Dash is not OFF.</text><text x="35" y="706" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#64748b">This shows ideal relative timing, not the speed of a particular sender.</text></svg>