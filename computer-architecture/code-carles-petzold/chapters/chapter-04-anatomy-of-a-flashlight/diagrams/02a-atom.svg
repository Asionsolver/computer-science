<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="545" viewBox="0 0 1000 545" role="img"><title>2A  LITHIUM ATOM | 3 protons, 4 neutrons, 3 electrons</title><rect width="1000" height="545" fill="#ffffff"/><text x="30" y="42" font-family="DejaVu Sans,sans-serif" font-size="27" fill="#0f172a">2A  LITHIUM ATOM | 3 protons, 4 neutrons, 3 electrons</text><circle cx="265" cy="280" r="100" fill="none" stroke="#cbd5e1" stroke-width="3"/><circle cx="265" cy="280" r="170" fill="none" stroke="#cbd5e1" stroke-width="3"/><circle cx="240" cy="260" r="19" fill="#fff7ed" stroke="#c26909" stroke-width="3"/><text x="227" y="266" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#c26909">p+</text><circle cx="285" cy="260" r="19" fill="#e2e8f0" stroke="#64748b" stroke-width="3"/><text x="272" y="266" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#64748b">n</text><circle cx="265" cy="298" r="19" fill="#fff7ed" stroke="#c26909" stroke-width="3"/><text x="252" y="304" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#c26909">p+</text><circle cx="305" cy="300" r="19" fill="#e2e8f0" stroke="#64748b" stroke-width="3"/><text x="292" y="306" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#64748b">n</text><circle cx="225" cy="300" r="19" fill="#e2e8f0" stroke="#64748b" stroke-width="3"/><text x="212" y="306" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#64748b">n</text><circle cx="270" cy="225" r="19" fill="#fff7ed" stroke="#c26909" stroke-width="3"/><text x="257" y="231" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#c26909">p+</text><circle cx="260" cy="336" r="19" fill="#e2e8f0" stroke="#64748b" stroke-width="3"/><text x="247" y="342" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#64748b">n</text><circle cx="165" cy="280" r="19" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="152" y="286" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#2563eb">e−</text><circle cx="365" cy="280" r="19" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="352" y="286" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#2563eb">e−</text><circle cx="265" cy="110" r="19" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="252" y="116" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#2563eb">e−</text><rect x="500" y="115" width="460" height="300" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="525" y="157" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#0f172a">NUCLEUS: protons + neutrons</text><text x="525" y="205" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#c26909">3 × proton (+) = positive charge</text><text x="525" y="253" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#64748b">4 × neutron = no charge</text><text x="525" y="301" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#2563eb">3 × electron (−) = negative charge</text><text x="525" y="370" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#0f172a">Neutral atom: +3 and −3 balance.</text><text x="30" y="495" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#0f172a">Simplified shell model of lithium-7; circles are not literal electron orbits.</text></svg>