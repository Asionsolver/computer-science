<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" role="img"><title>5  OHM’S LAW | voltage, current and resistance</title><rect width="1000" height="580" fill="#ffffff"/><text x="30" y="42" font-family="DejaVu Sans,sans-serif" font-size="27" fill="#0f172a">5  OHM’S LAW | voltage, current and resistance</text><path d="M240 90 L65 380 L415 380 Z" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><path d="M145 250 L335 250" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M240 250 L240 380" fill="none" stroke="#2563eb" stroke-width="3"/><text x="218" y="221" font-family="DejaVu Sans,sans-serif" font-size="44" fill="#2563eb">V</text><text x="158" y="337" font-family="DejaVu Sans,sans-serif" font-size="40" fill="#2563eb">I</text><text x="289" y="337" font-family="DejaVu Sans,sans-serif" font-size="40" fill="#2563eb">R</text><text x="525" y="150" font-family="DejaVu Sans,sans-serif" font-size="32" fill="#2563eb">V = I × R</text><text x="525" y="225" font-family="DejaVu Sans,sans-serif" font-size="32" fill="#2563eb">I = V / R</text><text x="525" y="300" font-family="DejaVu Sans,sans-serif" font-size="32" fill="#2563eb">R = V / I</text><text x="490" y="362" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#0f172a">V: volts    I: amperes    R: ohms</text><rect x="30" y="415" width="940" height="105" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/><text x="55" y="455" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#15803d">Example: V = 3 V, R = 4 Ω → I = 3 / 4 = 0.75 A</text><text x="55" y="492" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#15803d">Power: P = V × I = 3 × 0.75 = 2.25 W</text><text x="30" y="558" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#64748b">Book notation: E means voltage here; E = V. Triangle = a memory aid.</text></svg>