<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img"><title>4  WATER ANALOGY | match each idea, not the whole physics</title><rect width="1000" height="560" fill="#ffffff"/><text x="30" y="42" font-family="DejaVu Sans,sans-serif" font-size="27" fill="#0f172a">4  WATER ANALOGY | match each idea, not the whole physics</text><rect x="30" y="90" width="410" height="110" rx="12" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/><rect x="560" y="90" width="410" height="110" rx="12" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/><text x="50" y="130" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#2563eb">VOLTAGE (V)</text><text x="50" y="169" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#0f172a">Push driving the flow</text><path d="M455 143 L540 143" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M540 143 L530.3465918192059 148.27368092464624" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M540 143 L530.3465918192059 137.72631907535376" fill="none" stroke="#2563eb" stroke-width="3"/><text x="580" y="152" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#2563eb">Pressure DIFFERENCE</text><rect x="30" y="230" width="410" height="110" rx="12" fill="#f8fafc" stroke="#15803d" stroke-width="2"/><rect x="560" y="230" width="410" height="110" rx="12" fill="#f8fafc" stroke="#15803d" stroke-width="2"/><text x="50" y="270" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#15803d">CURRENT (I)</text><text x="50" y="309" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#0f172a">Rate of flow, not total water</text><path d="M455 283 L540 283" fill="none" stroke="#15803d" stroke-width="3"/><path d="M540 283 L530.3465918192059 288.2736809246462" fill="none" stroke="#15803d" stroke-width="3"/><path d="M540 283 L530.3465918192059 277.7263190753538" fill="none" stroke="#15803d" stroke-width="3"/><text x="580" y="292" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#15803d">Water volume per second</text><rect x="30" y="370" width="410" height="110" rx="12" fill="#f8fafc" stroke="#c26909" stroke-width="2"/><rect x="560" y="370" width="410" height="110" rx="12" fill="#f8fafc" stroke="#c26909" stroke-width="2"/><text x="50" y="410" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#c26909">RESISTANCE (R)</text><text x="50" y="449" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#0f172a">Opposition to flow</text><path d="M455 423 L540 423" fill="none" stroke="#c26909" stroke-width="3"/><path d="M540 423 L530.3465918192059 428.2736809246462" fill="none" stroke="#c26909" stroke-width="3"/><path d="M540 423 L530.3465918192059 417.7263190753538" fill="none" stroke="#c26909" stroke-width="3"/><text x="580" y="432" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#c26909">A narrow / restrictive pipe</text><text x="30" y="545" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#64748b">Useful for intuition; electricity is not literally water flowing through a pipe.</text></svg>