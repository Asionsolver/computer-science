<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="515" viewBox="0 0 1000 515" role="img"><title>6  SWITCH STATES | a physical choice can represent a bit</title><rect width="1000" height="515" fill="#ffffff"/><text x="30" y="42" font-family="DejaVu Sans,sans-serif" font-size="27" fill="#0f172a">6  SWITCH STATES | a physical choice can represent a bit</text><rect x="30" y="80" width="450" height="340" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><text x="55" y="120" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#64748b">OPEN = gap in path</text><path d="M90 190 L205 190" fill="none" stroke="#64748b" stroke-width="3"/><path d="M205 190 L275 160" fill="none" stroke="#64748b" stroke-width="5"/><circle cx="205" cy="190" r="5" fill="white" stroke="#64748b" stroke-width="3"/><circle cx="275" cy="190" r="5" fill="white" stroke="#64748b" stroke-width="3"/><path d="M275 190 L415 190" fill="none" stroke="#64748b" stroke-width="3"/><text x="55" y="265" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#64748b">No steady current*</text><text x="55" y="318" font-family="DejaVu Sans,sans-serif" font-size="25" fill="#64748b">Bulb OFF</text><text x="330" y="375" font-family="DejaVu Sans,sans-serif" font-size="70" fill="#64748b">0</text><rect x="520" y="80" width="450" height="340" rx="12" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/><text x="545" y="120" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#2563eb">CLOSED = path joined</text><path d="M580 190 L695 190" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M695 190 L765 190" fill="none" stroke="#2563eb" stroke-width="5"/><circle cx="695" cy="190" r="5" fill="white" stroke="#2563eb" stroke-width="3"/><circle cx="765" cy="190" r="5" fill="white" stroke="#2563eb" stroke-width="3"/><path d="M765 190 L905 190" fill="none" stroke="#2563eb" stroke-width="3"/><text x="545" y="265" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#2563eb">Current flows*</text><text x="545" y="318" font-family="DejaVu Sans,sans-serif" font-size="25" fill="#2563eb">Bulb ON</text><text x="820" y="375" font-family="DejaVu Sans,sans-serif" font-size="70" fill="#2563eb">1</text><text x="30" y="460" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#0f172a">* In an otherwise complete working flashlight circuit, as in diagram 1.</text><text x="30" y="500" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#64748b">Mapping used here: OFF → 0, ON → 1. These numbers are an encoding choice.</text></svg>