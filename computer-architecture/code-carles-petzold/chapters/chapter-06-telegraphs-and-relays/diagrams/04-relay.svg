 ry="26" fill="none" stroke="#2563eb" stroke-width="3"/><ellipse cx="301" cy="280" rx="7" ry="26" fill="none" stroke="#2563eb" stroke-width="3"/><ellipse cx="313" cy="280" rx="7" ry="26" fill="none" stroke="#2563eb" stroke-width="3"/><ellipse cx="325" cy="280" rx="7" ry="26" fill="none" stroke="#2563eb" stroke-width="3"/><ellipse cx="337" cy="280" rx="7" ry="26" fill="none" stroke="#2563eb" stroke-width="3"/><ellipse cx="349" cy="280" rx="7" ry="26" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M365 280 L385 280" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M385 280 L385 410" fill="none" stroke="#2563eb" stroke-width="3"/><text x="160" y="168" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#0f172a">sender key</text><text x="235" y="330" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#2563eb">relay coil</text><rect x="540" y="80" width="430" height="390" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="560" y="115" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#c26909">B  OUTPUT circuit</text><rect x="578" y="240" width="54" height="70" rx="12" fill="#fff7ed" stroke="#c26909" stroke-width="2"/><text x="598" y="266" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#c26909">+</text><text x="598" y="300" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#c26909">−</text><text x="560" y="350" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#c26909">Battery B</text><path d="M605 240 L605 190" fill="none" stroke="#c26909" stroke-width="3"/><path d="M605 310 L605 410" fill="none" stroke="#c26909" stroke-width="3"/><path d="M605 410 L895 410" fill="none" stroke="#c26909" stroke-width="3"/><path d="M605 190 L685 190" fill="none" stroke="#c26909" stroke-width="3"/><path d="M685 190 L755 190" fill="none" stroke="#c26909" stroke-width="5"/><circle cx="685" cy="190" r="5" fill="white" stroke="#c26909" stroke-width="3"/><circle cx="755" cy="190" r="5" fill="white" stroke="#c26909" s