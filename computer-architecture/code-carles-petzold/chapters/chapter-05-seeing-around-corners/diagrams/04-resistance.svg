<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img"><title>4  LONGER WIRE | more resistance, less current</title><rect width="1000" height="540" fill="#ffffff"/><text x="30" y="42" font-family="DejaVu Sans,sans-serif" font-size="27" fill="#0f172a">4  LONGER WIRE | more resistance, less current</text><rect x="30" y="90" width="450" height="290" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="50" y="130" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#0f172a">50 ft between homes</text><text x="50" y="180" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#0f172a">1 Ω wire + 4 Ω bulb = 5 Ω</text><text x="50" y="225" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#2563eb">I = 3 / 5 = 0.60 A</text><rect x="50" y="255" width="370" height="35" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="50" y="330" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#64748b">Relative current (same scale)</text><rect x="520" y="90" width="450" height="290" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="540" y="130" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#0f172a">1 mile between homes</text><text x="540" y="180" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#0f172a">105.6 Ω wire + 4 Ω = 109.6 Ω</text><text x="540" y="225" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#2563eb">I = 3 / 109.6 ≈ 0.027 A</text><rect x="540" y="255" width="17" height="35" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="540" y="330" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#64748b">Relative current (same scale)</text><text x="30" y="425" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#0f172a">Same 3 V battery, 20 AWG wire, and a simplified 4 Ω bulb model.</text><text x="30" y="465" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#0f172a">Wire length = outgoing + return = twice the distance between homes.</text><text x="30" y="505" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#64748b">The bulb is not a constant resistor in real operation; these are estimates.</text></svg>