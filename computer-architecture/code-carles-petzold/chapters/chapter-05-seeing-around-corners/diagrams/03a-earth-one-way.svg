<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="465" viewBox="0 0 1000 465" role="img"><title>3A  EARTH RETURN | 1 long wire, one-way</title><rect width="1000" height="465" fill="#ffffff"/><text x="30" y="42" font-family="DejaVu Sans,sans-serif" font-size="27" fill="#0f172a">3A  EARTH RETURN | 1 long wire, one-way</text><text x="45" y="85" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#2563eb">YOUR HOME (A)</text><text x="710" y="85" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#c26909">FRIEND’S HOME (B)</text><rect x="103" y="170" width="54" height="70" rx="12" fill="#fff7ed" stroke="#2563eb" stroke-width="2"/><text x="123" y="196" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#2563eb">+</text><text x="123" y="230" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#2563eb">−</text><path d="M130 170 L130 130" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M130 130 L280 130" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M280 130 L350 130" fill="none" stroke="#2563eb" stroke-width="5"/><circle cx="280" cy="130" r="5" fill="white" stroke="#2563eb" stroke-width="3"/><circle cx="350" cy="130" r="5" fill="white" stroke="#2563eb" stroke-width="3"/><path d="M350 130 L757 130" fill="none" stroke="#2563eb" stroke-width="3"/><circle cx="780" cy="130" r="23" fill="#fef08a" stroke="#2563eb" stroke-width="3"/><path d="M767 117 L793 143" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M767 143 L793 117" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M803 130 L870 130" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M870 130 L870 310" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M130 240 L130 310" fill="none" stroke="#2563eb" stroke-width="3"/><text x="275" y="113" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#0f172a">Key A</text><text x="745" y="105" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#0f172a">Bulb B</text><text x="420" y="115" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#2563eb">Only long wire</text><rect x="75" y="285" width="850" height="75" rx="12" fill="#ecfccb" stroke="#65a30d" stroke-width="2"/><path d="M130 270 L130 330" fill="none" stroke="#15803d" stroke-width="3"/><path d="M870 270 L870 330" fill="none" stroke="#15803d" stroke-width="3"/><path d="M835 322 L175 322" fill="none" stroke="#15803d" stroke-width="3"/><path d="M175 322 L184.6534081807941 316.7263190753538" fill="none" stroke="#15803d" stroke-width="3"/><path d="M175 322 L184.6534081807941 327.2736809246462" fill="none" stroke="#15803d" stroke-width="3"/><text x="330" y="309" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#15803d">Earth is the RETURN path</text><text x="35" y="404" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#0f172a">Battery (+) → key → wire → bulb → earth → battery (−)</text><text x="35" y="443" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#64748b">The loop is complete through earth; earth has resistance too.</text></svg>