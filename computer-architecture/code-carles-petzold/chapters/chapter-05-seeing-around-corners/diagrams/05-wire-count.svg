<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img"><title>5  WIRE COUNT | compare the same communication task</title><rect width="1000" height="600" fill="#ffffff"/><text x="30" y="42" font-family="DejaVu Sans,sans-serif" font-size="27" fill="#0f172a">5  WIRE COUNT | compare the same communication task</text><text x="35" y="95" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#0f172a">TWO-WAY communication</text><text x="40" y="150" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#0f172a">Separate return wires</text><path d="M400 126 L780 126" fill="none" stroke="#2563eb" stroke-width="4"/><path d="M400 139 L780 139" fill="none" stroke="#2563eb" stroke-width="4"/><path d="M400 152 L780 152" fill="none" stroke="#15803d" stroke-width="4"/><path d="M400 165 L780 165" fill="none" stroke="#15803d" stroke-width="4"/><text x="825" y="150" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#0f172a">4 wires</text><text x="40" y="260" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#0f172a">Shared common wire</text><path d="M400 236 L780 236" fill="none" stroke="#2563eb" stroke-width="4"/><path d="M400 249 L780 249" fill="none" stroke="#2563eb" stroke-width="4"/><path d="M400 262 L780 262" fill="none" stroke="#15803d" stroke-width="4"/><text x="825" y="260" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#0f172a">3 wires</text><text x="40" y="370" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#0f172a">Earth return</text><path d="M400 346 L780 346" fill="none" stroke="#2563eb" stroke-width="4"/><path d="M400 359 L780 359" fill="none" stroke="#2563eb" stroke-width="4"/><text x="825" y="370" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#0f172a">2 wires</text><path d="M35 430 L960 430" fill="none" stroke="#cbd5e1" stroke-width="3"/><text x="35" y="475" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#0f172a">ONE-WAY: separate return = 2 wires; earth return = 1 wire.</text><text x="35" y="525" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#64748b">Count only the long wires between homes, not local connections.</text><text x="35" y="568" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#15803d">4 → 3 = 25% less long-wire length; 4 → 2 = 50% less.</text></svg>